<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>test worksheet</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
  <style>
    :root {
      --text: #37352f;
      --muted: rgba(55, 53, 47, 0.68);
      --border: rgba(55, 53, 47, 0.16);
      --soft-bg: rgba(241, 241, 239, 0.78);
      --link-underline: rgba(55, 53, 47, 0.35);
    }

    @page {
      size: A4;
      margin: 12mm 14mm 13mm;
    }

    * { box-sizing: border-box; }

    html {
      background: #f7f7f5;
    }

    body {
      font-family: "Noto Sans TC", "Noto Sans CJK TC", "PingFang TC", "Microsoft JhengHei", -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      color: var(--text);
      font-size: 14px;
      line-height: 1.46;
      letter-spacing: 0;
      margin: 0;
      padding: 0;
      overflow-wrap: break-word;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }

    @media screen {
      body {
        max-width: 182mm;
        margin: 24px auto;
        padding: 12mm 14mm;
        background: #fff;
        box-shadow: 0 10px 34px rgba(15, 23, 42, 0.12);
      }
    }

    h1 {
      font-size: 28px;
      font-weight: 700;
      line-height: 1.22;
      margin: 0 0 18px;
      page-break-after: avoid;
      break-after: avoid;
    }

    h2 {
      font-size: 21px;
      font-weight: 600;
      line-height: 1.28;
      margin: 22px 0 7px;
      break-after: avoid;
      page-break-after: avoid;
    }

    h3 {
      font-size: 16px;
      font-weight: 600;
      line-height: 1.32;
      margin: 16px 0 4px;
      break-after: avoid;
      page-break-after: avoid;
    }

    p {
      margin: 3px 0;
      min-height: 1em;
    }

    ul, ol {
      margin: 4px 0 7px;
      padding-left: 1.45em;
    }

    li {
      margin: 2px 0;
      padding-left: 0.1em;
    }

    li > ul,
    li > ol {
      margin: 2px 0 2px;
    }

    blockquote {
      border-left: 3px solid rgba(55, 53, 47, 0.35);
      padding: 5px 10px;
      margin: 8px 0;
      background: var(--soft-bg);
      color: var(--text);
      break-inside: avoid;
    }

    table {
      border-collapse: collapse;
      width: 100%;
      margin: 9px 0;
      font-size: 13px;
      line-height: 1.35;
      table-layout: auto;
      break-inside: avoid;
    }

    th, td {
      border: 1px solid var(--border);
      padding: 6px 8px;
      vertical-align: top;
    }

    th {
      background-color: rgb(247, 246, 243);
      font-weight: 600;
    }

    figure.notion-image {
      margin: 8px 0;
      text-align: center;
      break-inside: avoid;
      page-break-inside: avoid;
    }

    figure.notion-image img {
      max-width: min(100%, 112mm);
      max-height: 84mm;
      width: auto;
      height: auto;
      display: block;
      margin: 0 auto;
      object-fit: contain;
      break-inside: avoid;
      page-break-inside: avoid;
    }

    .column figure.notion-image {
      margin: 4px 0;
    }

    .column figure.notion-image img {
      max-width: 100%;
      max-height: 56mm;
    }

    figcaption {
      color: var(--muted);
      font-size: 12px;
      margin-top: 4px;
    }

    .callout {
      display: flex;
      align-items: flex-start;
      border-radius: 4px;
      padding: 9px 11px;
      margin: 8px 0;
      page-break-inside: avoid;
      break-inside: avoid;
      width: 100%;
    }

    .callout-emoji {
      font-size: 1.5em;
      margin-right: 10px;
      flex-shrink: 0;
      line-height: 1.3;
    }

    .callout-content {
      flex: 1;
      min-width: 0;
    }

    .callout-content p {
      margin: 2px 0;
    }

    .math-block {
      margin: 8px 0;
      text-align: center;
      overflow-x: auto;
      break-inside: avoid;
    }

    .katex { font-size: 1.04em; }

    .katex-display {
      margin: 0.45em 0;
      overflow-x: auto;
      overflow-y: hidden;
    }

    code {
      background: rgba(135, 131, 120, 0.15);
      color: #eb5757;
      border-radius: 3px;
      font-size: 85%;
      padding: 0.16em 0.34em;
      font-family: "SFMono-Regular", Menlo, Consolas, monospace;
      overflow-wrap: anywhere;
    }

    pre {
      background: rgb(247, 246, 243);
      border-radius: 4px;
      padding: 16px;
      overflow-x: auto;
    }
    pre code {
      background: transparent;
      color: inherit;
      padding: 0;
    }

    a {
      color: inherit;
      text-decoration: underline;
      text-decoration-color: var(--link-underline);
      text-underline-offset: 3px;
      overflow-wrap: anywhere;
    }

    hr {
      border: 0;
      border-top: 1px solid rgb(233, 233, 231);
      margin: 8px 0;
    }

    details {
      margin: 4px 0;
    }
    summary {
      cursor: pointer;
      font-weight: 500;
    }

    .column-list {
      display: flex;
      gap: 16px;
      align-items: flex-start;
      margin: 5px 0 7px;
      break-inside: avoid;
      page-break-inside: avoid;
    }

    .column {
      flex: 1;
      min-width: 0;
    }

    .child-page {
      margin: 0;
    }

    .child-page + .child-page {
      margin-top: 20px;
    }

    .todo {
      margin: 2px 0;
    }

    @media print {
      html { background: #fff; }

      body {
        font-size: 14px;
        max-width: none;
        margin: 0;
        padding: 0;
      }

      h1, h2, h3 {
        break-after: avoid;
        page-break-after: avoid;
      }

      h2, h3, figure.notion-image, .callout, blockquote, tr, details, .math-block, .column-list {
        break-inside: avoid;
        page-break-inside: avoid;
      }

      p, li {
        orphans: 2;
        widows: 2;
      }

      a {
        text-decoration-thickness: 0.5px;
      }
    }
  </style>
</head>
